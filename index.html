<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polytopia Combat Queue UI</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.5;
      }
      body {
        max-width: 1120px;
        margin: 0 auto;
        padding: 1rem;
      }
      * {
        box-sizing: border-box;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .panel {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 0.75rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .row select {
        width: 100%;
      }
      select,
      button,
      input {
        padding: 0.45rem 0.6rem;
        font-size: 1rem;
      }
      .hp-input {
        width: 3.8rem;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 0.45rem;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto auto auto auto;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.45rem;
      }
      .table-container {
        width: 100%;
        overflow-x: auto;
      }
      .unit-meta {
        font-size: 0.88rem;
        color: #444;
      }
      .controls {
        display: flex;
        gap: 0.45rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .toggle-group {
        display: inline-flex;
        gap: 0.3rem;
        flex-wrap: wrap;
      }
      .toggle-button {
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        background: #f8fafc;
        color: #111827;
        cursor: pointer;
        padding: 0.2rem 0.55rem;
        font-size: 0.85rem;
        line-height: 1.35;
      }
      .toggle-button.is-active {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .move-controls {
        display: flex;
        gap: 0.3rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #e5e7eb;
        padding: 0.4rem;
        text-align: left;
      }
      .error {
        color: #b42318;
        font-weight: 600;
      }
      .event-dead {
        background: #fee4e2;
        color: #b42318;
        font-weight: 600;
      }
      .event-poisoned {
        background: #ecfdf3;
        color: #027a48;
        font-weight: 600;
      }
      .unit-final-dead {
        background: #fee4e2;
        color: #b42318;
        font-weight: 600;
        border-radius: 4px;
        padding: 0.12rem 0.35rem;
        display: inline-block;
      }
      .unit-final-poisoned {
        background: #ecfdf3;
        color: #027a48;
        font-weight: 600;
        border-radius: 4px;
        padding: 0.12rem 0.35rem;
        display: inline-block;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 680px) {
        body {
          padding: 0.75rem;
        }
        h1 {
          font-size: 1.4rem;
        }
        h2 {
          font-size: 1.1rem;
        }
        li {
          grid-template-columns: 1fr;
          align-items: stretch;
        }
        .controls {
          justify-content: flex-start;
        }
        .move-controls {
          justify-content: flex-start;
        }
        .hp-input {
          width: 100%;
        }
        th,
        td {
          white-space: nowrap;
          font-size: 0.92rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>Polytopia Combat Queue UI</h1>
    <p id="loadError" class="error" hidden></p>

    <div class="layout">
      <section class="panel">
        <h2>Attackers</h2>
        <div class="row">
          <select id="attackerSelect"></select>
          <button id="maximizeAttackersButton" type="button">Maximize</button>
        </div>
        <ul id="attackerList"></ul>
      </section>

      <section class="panel">
        <h2>Defenders</h2>
        <div class="row">
          <select id="defenderSelect"></select>
        </div>
        <ul id="defenderList"></ul>
      </section>
    </div>

    <section class="panel" style="margin-top: 1rem">
      <h2>Resolution</h2>
      <div class="table-container">
        <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Attacker</th>
            <th>Attacker Damage</th>
            <th>Defender</th>
            <th>Defender Damage</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
        </table>
      </div>
      <p style="margin-top: 0.75rem">Share URL:</p>
      <p id="shareUrl" class="mono"></p>
    </section>

    <script src="./units.json"></script>
    <script src="./combat.json"></script>
    <script src="./combat.js"></script>
    <script>
      const state = {
        attackers: [],
        defenders: [],
      };

      let units = [];
      let unitMap = new Map();

      const attackerSelect = document.getElementById('attackerSelect');
      const defenderSelect = document.getElementById('defenderSelect');
      const attackerList = document.getElementById('attackerList');
      const defenderList = document.getElementById('defenderList');
      const maximizeAttackersButton = document.getElementById('maximizeAttackersButton');
      const resultBody = document.getElementById('resultBody');
      const shareUrl = document.getElementById('shareUrl');
      const loadError = document.getElementById('loadError');
      const combatEngine = window.POLYTOPIA_COMBAT;

      const DEFENSE_MODES = {
        na: 'na',
        def: 'def',
        wall: 'wall',
      };
      const PRIORITY_UNIT_GROUPS = [
        {
          label: 'Normal',
          names: ['Warrior', 'Rider', 'Defender', 'Swordsman', 'Catapult', 'Knight', 'Giant'],
        },
        {
          label: 'Naval',
          names: ['Scout', 'Rammer', 'Bomber', 'Juggernaut'],
        },
        {
          label: 'Elyrion',
          names: ['Polytaur', 'Baby Dragon', 'Fire Dragon'],
        },
        {
          label: 'Cymanti',
          names: ['Hexapod', 'Exida', 'Doomux', 'Centipede', 'Segment'],
        },
        {
          label: 'Polaris',
          names: ['Gaami', 'Battle Sled'],
        },
        {
          label: 'Aquarion',
          names: ['Tridention', 'Crab', 'Shark', 'Jelly'],
        },
      ];

      function hasSkill(name, skill) {
        const unit = unitMap.get(name);
        return Boolean(unit && Array.isArray(unit.skills) && unit.skills.includes(skill));
      }

      function canSplash(name) {
        return hasSkill(name, 'splash') || hasSkill(name, 'explode') || hasSkill(name, 'stomp');
      }

      function canExplode(name) {
        return hasSkill(name, 'explode');
      }

      function canWall(name) {
        return hasSkill(name, 'fortify');
      }

      function canVet(name) {
        const unit = unitMap.get(name);
        return Boolean(unit && unit.veteran);
      }

      function canHp10(name) {
        const unit = unitMap.get(name);
        return Boolean(unit && unit.health === null);
      }

      function canPoison(name) {
        return hasSkill(name, 'poison');
      }

      function calcDefenseBonus(defenseMode, pois) {
        const table = pois
          ? { na: 0.5, def: 0.7, wall: 2 }
          : { na: 1, def: 1.5, wall: 4 };
        return table[defenseMode] ?? table.na;
      }

      function normalizeDefenseModeForUnit(name, defenseMode) {
        const wallAllowed = canWall(name);
        if (!wallAllowed && defenseMode === DEFENSE_MODES.wall) {
          return DEFENSE_MODES.def;
        }
        if (defenseMode === DEFENSE_MODES.na || defenseMode === DEFENSE_MODES.def || defenseMode === DEFENSE_MODES.wall) {
          return defenseMode;
        }
        return DEFENSE_MODES.na;
      }

      function parseStateFromUrl() {
        const params = new URLSearchParams(window.location.search);
        state.attackers = parseGroup(params.get('a'), 'attacker');
        state.defenders = parseGroup(params.get('d'), 'defender');
      }

      function parseGroup(raw, side) {
        if (!raw) return [];
        return raw
          .split(',')
          .map((item) => item.trim())
          .filter(Boolean)
          .map((item) => {
            const [encodedName, hpRaw, p3, p4, p5, p6] = item.split(':');
            const name = decodeURIComponent(encodedName || '');
            const hp = Number.parseFloat(hpRaw);

            if (side === 'attacker') {
              return {
                name,
                hp,
                splash: p3 === '1',
                vet: p4 === '1',
                hp10: p5 === '1',
              };
            }

            return {
              name,
              hp,
              defenseMode: p3 || DEFENSE_MODES.na,
              pois: p4 === '1',
              vet: p5 === '1',
              hp10: p6 === '1',
            };
          })
          .filter((u) => u.name);
      }

      function serializeGroup(group, side) {
        return group
          .map((unit) => {
            const encodedName = encodeURIComponent(unit.name);
            const hp = Math.max(0, unit.hp);
            if (side === 'attackers') {
              return `${encodedName}:${hp}:${unit.splash ? '1' : '0'}:${unit.vet ? '1' : '0'}:${unit.hp10 ? '1' : '0'}`;
            }

            const defenseMode = normalizeDefenseModeForUnit(unit.name, unit.defenseMode || DEFENSE_MODES.na);
            return `${encodedName}:${hp}:${defenseMode}:${unit.pois ? '1' : '0'}:${unit.vet ? '1' : '0'}:${unit.hp10 ? '1' : '0'}`;
          })
          .join(',');
      }

      function syncUrl() {
        const params = new URLSearchParams();
        params.set('a', serializeGroup(state.attackers, 'attackers'));
        params.set('d', serializeGroup(state.defenders, 'defenders'));
        const next = `${window.location.pathname}?${params.toString()}`;
        history.replaceState(null, '', next);
        shareUrl.textContent = window.location.href;
      }

      function makeUnitSnapshot(name, options = {}) {
        const base = unitMap.get(name);
        if (!base) return null;
        const hpBase = Number.isFinite(base.health) ? base.health : (options.hp10 ? 10 : 15);
        const maxHp = options.vet && base.veteran ? hpBase * 1.5 : hpBase;
        return { name: base.name, hp: maxHp, maxHp, attack: base.attack, defense: base.defence };
      }

      function clampHp(hp, maxHp) {
        return Math.max(0, Math.min(maxHp, hp));
      }

      function moveUnit(group, index, delta) {
        const target = index + delta;
        if (target < 0 || target >= group.length) return;
        const copy = group[index];
        group[index] = group[target];
        group[target] = copy;
        renderAll();
      }

      function calculateAttackOutcome(attacker, defender) {
        const defenseBonus = calcDefenseBonus(defender.defenseMode, defender.pois);
        return combatEngine.calculateCombatExchange(
          attacker,
          { ...defender, defenseBonus },
          attacker.splash,
        );
      }

      function buildCombatUnits() {
        const attackerUnits = state.attackers
          .map((u, index) => {
            const snapshot = makeUnitSnapshot(u.name, u);
            if (!snapshot) return null;
            return {
              ...snapshot,
              id: `a-${index}`,
              hp: clampHp(u.hp, snapshot.maxHp),
              splash: Boolean(u.splash && canSplash(u.name)),
              poison: canPoison(u.name),
            };
          })
          .filter(Boolean);

        const defenderUnits = state.defenders
          .map((u) => {
            const snapshot = makeUnitSnapshot(u.name, u);
            if (!snapshot) return null;
            return {
              ...snapshot,
              hp: clampHp(u.hp, snapshot.maxHp),
              defenseMode: normalizeDefenseModeForUnit(u.name, u.defenseMode),
              pois: Boolean(u.pois),
            };
          })
          .filter(Boolean);

        return { attackerUnits, defenderUnits };
      }

      function evaluateOrder(attackerOrder, defenderUnits) {
        const defenders = defenderUnits.map((u) => ({ ...u }));
        let defenderIndex = 0;
        let totalDefenderDamage = 0;

        attackerOrder.forEach((attacker) => {
          while (defenderIndex < defenders.length && defenders[defenderIndex].hp <= 0) {
            defenderIndex += 1;
          }
          if (defenderIndex >= defenders.length) {
            return;
          }

          const target = defenders[defenderIndex];
          const defenderHpBefore = target.hp;
          const result = calculateAttackOutcome(attacker, target);
          attacker.hp = result.attackerHp;
          target.hp = result.defenderHp;
          totalDefenderDamage += defenderHpBefore - result.defenderHp;
          if (attacker.poison && target.hp > 0) {
            target.pois = true;
          }
        });

        return {
          totalDefenderDamage,
          defenders,
          defenderIndex,
        };
      }

      function maximizeAttackerOrder() {
        if (!combatEngine || typeof combatEngine.calculateCombatExchange !== 'function') {
          throw new Error('combat.js did not expose calculateCombatExchange.');
        }

        const { attackerUnits, defenderUnits } = buildCombatUnits();
        if (attackerUnits.length <= 1 || defenderUnits.length === 0) {
          return;
        }

        const remaining = attackerUnits.map((unit) => ({ ...unit }));
        const chosen = [];
        let currentDefenders = defenderUnits.map((unit) => ({ ...unit }));

        while (remaining.length > 8) {
          let defenderIndex = 0;
          while (defenderIndex < currentDefenders.length && currentDefenders[defenderIndex].hp <= 0) {
            defenderIndex += 1;
          }
          if (defenderIndex >= currentDefenders.length) {
            break;
          }

          let bestIndex = 0;
          let bestTuple = [-1, -Infinity, -Infinity];
          let bestDamage = 0;
          let bestResult = null;

          remaining.forEach((candidate, idx) => {
            const defenderClone = { ...currentDefenders[defenderIndex] };
            const candidateClone = { ...candidate };
            const result = calculateAttackOutcome(candidateClone, defenderClone);
            const defenderDamage = defenderClone.hp - result.defenderHp;
            const tuple = [candidate.poison ? 1 : 0, defenderDamage, -candidate.attack];

            if (
              tuple[0] > bestTuple[0] ||
              (tuple[0] === bestTuple[0] && tuple[1] > bestTuple[1]) ||
              (tuple[0] === bestTuple[0] && tuple[1] === bestTuple[1] && tuple[2] > bestTuple[2])
            ) {
              bestIndex = idx;
              bestTuple = tuple;
              bestDamage = defenderDamage;
              bestResult = result;
            }
          });

          const picked = remaining.splice(bestIndex, 1)[0];
          if (!bestResult) {
            break;
          }

          const liveDefender = currentDefenders[defenderIndex];
          liveDefender.hp = bestResult.defenderHp;
          if (picked.poison && liveDefender.hp > 0) {
            liveDefender.pois = true;
          }
          chosen.push(picked);
        }

        const tail = remaining;
        let bestTailOrder = tail.map((unit) => ({ ...unit }));
        let bestTailDamage = -Infinity;

        function search(available, path) {
          if (available.length === 0) {
            const startDefenders = currentDefenders.map((unit) => ({ ...unit }));
            const pathCopy = path.map((unit) => ({ ...unit }));
            const outcome = evaluateOrder(pathCopy, startDefenders);
            if (outcome.totalDefenderDamage > bestTailDamage) {
              bestTailDamage = outcome.totalDefenderDamage;
              bestTailOrder = path.map((unit) => ({ ...unit }));
            }
            return;
          }

          for (let i = 0; i < available.length; i += 1) {
            const next = available[i];
            const rest = available.slice(0, i).concat(available.slice(i + 1));
            path.push(next);
            search(rest, path);
            path.pop();
          }
        }

        search(tail, []);
        const finalOrder = chosen.concat(bestTailOrder);
        const currentById = new Map(state.attackers.map((unit, index) => [`a-${index}`, unit]));
        state.attackers = finalOrder.map((unit) => currentById.get(unit.id)).filter(Boolean);
        renderAll();
      }

      function createToggleButton(label, active, onClick) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = active ? 'toggle-button is-active' : 'toggle-button';
        button.textContent = label;
        button.setAttribute('aria-pressed', String(active));
        button.addEventListener('click', onClick);
        return button;
      }

      function createOutcomeLookup(outcome, side) {
        if (!outcome) return new Map();
        const entries = side === 'attackers' ? outcome.finalAttackers : outcome.finalDefenders;
        return new Map(entries.map((unit) => [unit.id, unit]));
      }

      function formatEditableUnitSummary(unit, hpCurrent, hpFinal) {
        const current = Math.max(0, Math.round(hpCurrent));
        const final = Number.isFinite(hpFinal) ? Math.max(0, Math.round(hpFinal)) : '-';
        return `${unit.name} (H${unit.maxHp},A${unit.attack},D${unit.defense}) [${current}]->${final}`;
      }

      function renderGroup(container, group, side, outcome) {
        container.innerHTML = '';
        const outcomeLookup = createOutcomeLookup(outcome, side);
        group.forEach((unit, index) => {
          const li = document.createElement('li');
          const snapshot = makeUnitSnapshot(unit.name, unit);
          if (!snapshot) return;
          const outcomeId = `${side === 'attackers' ? 'a' : 'd'}-${index}`;
          const finalUnit = outcomeLookup.get(outcomeId);
          const predictedFinalHp = finalUnit ? finalUnit.hp : undefined;

          const left = document.createElement('div');
          const label = document.createElement('div');
          label.textContent = formatEditableUnitSummary(snapshot, unit.hp, predictedFinalHp);
          if (finalUnit && finalUnit.hp <= 0) {
            label.classList.add('unit-final-dead');
          } else if (finalUnit && finalUnit.pois) {
            label.classList.add('unit-final-poisoned');
          }
          const meta = document.createElement('div');
          meta.className = 'unit-meta';
          left.append(label);
          if (meta.textContent) {
            left.append(meta);
          }

          const hpInput = document.createElement('input');
          hpInput.className = 'hp-input';
          hpInput.type = 'number';
          hpInput.min = '0';
          hpInput.step = '1';
          hpInput.value = String(unit.hp);
          hpInput.addEventListener('change', () => {
            const value = Math.max(0, Math.round(Number.parseFloat(hpInput.value) || 0));
            unit.hp = clampHp(value, snapshot.maxHp);
            renderAll();
          });

          const controls = document.createElement('div');
          controls.className = 'controls';
          if (side === 'attackers') {
            if (canSplash(unit.name)) {
              const splashButton = createToggleButton('splash', Boolean(unit.splash), () => {
                unit.splash = !unit.splash;
                renderAll();
              });
              controls.appendChild(splashButton);
            }
            unit.splash = Boolean(unit.splash && canSplash(unit.name));
          } else {
            const defenseMode = normalizeDefenseModeForUnit(unit.name, unit.defenseMode);
            unit.defenseMode = defenseMode;

            const defenseModes = canWall(unit.name)
              ? [DEFENSE_MODES.def, DEFENSE_MODES.wall]
              : [DEFENSE_MODES.def];

            const defenseWrapper = document.createElement('span');
            defenseWrapper.className = 'toggle-group';
            defenseModes.forEach((mode) => {
              const modeButton = createToggleButton(mode, defenseMode === mode, () => {
                unit.defenseMode = unit.defenseMode === mode ? DEFENSE_MODES.na : mode;
                renderAll();
              });
              defenseWrapper.append(modeButton);
            });

            const poisButton = createToggleButton('pois', Boolean(unit.pois), () => {
              unit.pois = !unit.pois;
              renderAll();
            });

            controls.append(defenseWrapper, poisButton);
          }

          if (canVet(unit.name)) {
            const vetButton = createToggleButton('vet', Boolean(unit.vet), () => {
              unit.vet = !unit.vet;
              const nextSnapshot = makeUnitSnapshot(unit.name, unit);
              if (nextSnapshot) {
                unit.hp = clampHp(unit.hp, nextSnapshot.maxHp);
              }
              renderAll();
            });
            controls.appendChild(vetButton);
          } else {
            unit.vet = false;
          }

          if (canHp10(unit.name)) {
            const hp10Label = document.createElement('label');
            const hp10Input = document.createElement('input');
            hp10Input.type = 'checkbox';
            hp10Input.checked = Boolean(unit.hp10);
            hp10Input.addEventListener('change', () => {
              unit.hp10 = hp10Input.checked;
              const nextSnapshot = makeUnitSnapshot(unit.name, unit);
              if (nextSnapshot) {
                unit.hp = clampHp(unit.hp, nextSnapshot.maxHp);
              }
              renderAll();
            });
            hp10Label.append(hp10Input, ' hp10');
            controls.appendChild(hp10Label);
          } else {
            unit.hp10 = false;
          }

          const moveControls = document.createElement('div');
          moveControls.className = 'move-controls';
          const upButton = document.createElement('button');
          upButton.textContent = '↑';
          upButton.title = 'Move up';
          upButton.disabled = index === 0;
          upButton.addEventListener('click', () => moveUnit(group, index, -1));

          const downButton = document.createElement('button');
          downButton.textContent = '↓';
          downButton.title = 'Move down';
          downButton.disabled = index === group.length - 1;
          downButton.addEventListener('click', () => moveUnit(group, index, 1));
          moveControls.append(upButton, downButton);

          const removeButton = document.createElement('button');
          removeButton.textContent = '✕';
          removeButton.addEventListener('click', () => {
            group.splice(index, 1);
            renderAll();
          });

          li.append(left, hpInput, controls, moveControls, removeButton);
          container.appendChild(li);
        });

        if (group.length === 0) {
          const empty = document.createElement('li');
          empty.textContent = `No ${side} yet`;
          container.appendChild(empty);
        }
      }

      function computeQueueResult() {
        if (!combatEngine || typeof combatEngine.calculateCombatExchange !== 'function') {
          throw new Error('combat.js did not expose calculateCombatExchange.');
        }

        const attackerUnits = state.attackers
          .map((u, index) => {
            const snapshot = makeUnitSnapshot(u.name, u);
            if (!snapshot) return null;
            return {
              id: `a-${index}`,
              ...snapshot,
              hp: clampHp(u.hp, snapshot.maxHp),
              splash: Boolean(u.splash && canSplash(u.name)),
              explode: canExplode(u.name),
              poison: canPoison(u.name),
            };
          })
          .filter(Boolean);

        const defenderUnits = state.defenders
          .map((u, index) => {
            const snapshot = makeUnitSnapshot(u.name, u);
            if (!snapshot) return null;
            const mode = normalizeDefenseModeForUnit(u.name, u.defenseMode);
            const pois = Boolean(u.pois);
            return {
              id: `d-${index}`,
              ...snapshot,
              hp: clampHp(u.hp, snapshot.maxHp),
              defenseMode: mode,
              pois,
            };
          })
          .filter(Boolean);

        const rounds = [];
        let defenderIndex = 0;
        attackerUnits.forEach((attacker, attackerIndex) => {
          while (defenderIndex < defenderUnits.length && defenderUnits[defenderIndex].hp <= 0) {
            defenderIndex += 1;
          }
          if (defenderIndex >= defenderUnits.length) {
            rounds.push({
              index: attackerIndex + 1,
              attackerLabel: formatUnitSummary(attacker, attacker.hp),
              attackerDamageText: '-',
              defenderLabel: '-',
              defenderDamageText: '-',
            });
            return;
          }

          const target = defenderUnits[defenderIndex];
          const attackerHpBefore = attacker.hp;
          const defenderHpBefore = target.hp;
          const defenderPoisonedBefore = target.pois;
          const defenseBonus = calcDefenseBonus(target.defenseMode, target.pois);
          const result = calculateAttackOutcome(attacker, target);
          attacker.hp = result.attackerHp;
          target.hp = result.defenderHp;
          if (attacker.poison && target.hp > 0) {
            target.pois = true;
          }
          if (attacker.explode && result.attackDamageRaw > 0 && target.hp > 0) {
            target.pois = true;
          }
          const defenderPoisonedThisRound = !defenderPoisonedBefore && target.pois;
          rounds.push({
            index: attackerIndex + 1,
            attackerLabel: formatUnitSummary(attacker, attackerHpBefore),
            attackerDamageText: formatDamageFlow(
              attackerHpBefore,
              attackerHpBefore - result.attackerHp,
              result.defenseDamageRaw,
              result.attackerHp,
            ),
            defenderLabel: `${formatUnitSummary(target, defenderHpBefore)} (bonus x${defenseBonus})`,
            defenderDamageText: formatDamageFlow(
              defenderHpBefore,
              defenderHpBefore - result.defenderHp,
              result.attackDamageRaw,
              result.defenderHp,
            ),
            attackerDied: result.attackerHp <= 0,
            defenderDied: result.defenderHp <= 0,
            defenderPoisoned: defenderPoisonedThisRound,
          });
        });

        return {
          rounds,
          finalAttackers: attackerUnits,
          finalDefenders: defenderUnits,
        };
      }

      function formatUnitSummary(unit, hp) {
        return `${unit.name} (HP${hp}/${unit.maxHp},A${unit.attack},D${unit.defense})`;
      }

      function formatDamageFlow(hpBefore, damageRounded, damageRaw, hpAfter) {
        return `${hpBefore} - ${damageRounded} (${damageRaw.toFixed(2)}) => ${hpAfter}`;
      }

      function renderResult(outcome) {
        resultBody.innerHTML = '';
        const { rounds } = outcome;

        rounds.forEach((round) => {
          const tr = document.createElement('tr');
          const attackerClass = round.attackerDied ? 'event-dead' : '';
          const defenderClass = round.defenderDied
            ? 'event-dead'
            : (round.defenderPoisoned ? 'event-poisoned' : '');
          tr.innerHTML = `
            <td>${round.index}</td>
            <td class="${attackerClass}">${round.attackerLabel}</td>
            <td>${round.attackerDamageText}</td>
            <td class="${defenderClass}">${round.defenderLabel}</td>
            <td>${round.defenderDamageText}</td>
          `;
          resultBody.appendChild(tr);
        });

        if (rounds.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="5">No attackers selected</td>';
          resultBody.appendChild(tr);
        }
      }

      function renderAll() {
        const outcome = computeQueueResult();
        renderGroup(attackerList, state.attackers, 'attackers', outcome);
        renderGroup(defenderList, state.defenders, 'defenders', outcome);
        renderResult(outcome);
        syncUrl();
      }

      function appendUnit(side, selectedName) {
        const snapshot = makeUnitSnapshot(selectedName);
        if (!snapshot) return;

        if (side === 'attackers') {
          state.attackers.push({ name: snapshot.name, hp: snapshot.maxHp, splash: false, vet: false, hp10: false });
        } else {
          state.defenders.push({ name: snapshot.name, hp: snapshot.maxHp, defenseMode: DEFENSE_MODES.na, pois: false, vet: false, hp10: false });
        }

        renderAll();
      }

      function hydrateFromUrlAgainstUnits() {
        state.attackers = state.attackers
          .map((u) => {
            const base = makeUnitSnapshot(u.name, u);
            if (!base) return null;
            return {
              name: u.name,
              hp: Number.isNaN(u.hp) ? base.maxHp : clampHp(Math.round(u.hp), base.maxHp),
              splash: Boolean(u.splash && canSplash(u.name)),
              vet: Boolean(u.vet && canVet(u.name)),
              hp10: Boolean(u.hp10 && canHp10(u.name)),
            };
          })
          .filter(Boolean);

        state.defenders = state.defenders
          .map((u) => {
            const base = makeUnitSnapshot(u.name, u);
            if (!base) return null;
            return {
              name: u.name,
              hp: Number.isNaN(u.hp) ? base.maxHp : clampHp(Math.round(u.hp), base.maxHp),
              defenseMode: normalizeDefenseModeForUnit(u.name, u.defenseMode || DEFENSE_MODES.na),
              pois: Boolean(u.pois),
              vet: Boolean(u.vet && canVet(u.name)),
              hp10: Boolean(u.hp10 && canHp10(u.name)),
            };
          })
          .filter(Boolean);
      }

      function populateSelectors() {
        const unitsSortedByName = [...units].sort((a, b) => a.name.localeCompare(b.name));

        function appendOption(parent, unit) {
          const option = document.createElement('option');
          option.value = unit.name;
          const hpText = Number.isFinite(unit.health) ? unit.health : '15/10';
          option.textContent = `${unit.name} (HP ${hpText}, ATK ${unit.attack}, DEF ${unit.defence})`;
          parent.appendChild(option);
        }

        for (const select of [attackerSelect, defenderSelect]) {
          select.innerHTML = '';
          const placeholder = document.createElement('option');
          placeholder.value = '';
          placeholder.textContent = 'Select a unit';
          placeholder.selected = true;
          select.appendChild(placeholder);

          PRIORITY_UNIT_GROUPS.forEach((group) => {
            const optgroup = document.createElement('optgroup');
            optgroup.label = group.label;
            group.names.forEach((name) => {
              const unit = unitMap.get(name);
              if (!unit) return;
              appendOption(optgroup, unit);
            });
            if (optgroup.childElementCount > 0) {
              select.appendChild(optgroup);
            }
          });

          const alphabeticalOptgroup = document.createElement('optgroup');
          alphabeticalOptgroup.label = 'Alphabetical';
          unitsSortedByName.forEach((unit) => {
            appendOption(alphabeticalOptgroup, unit);
          });
          select.appendChild(alphabeticalOptgroup);
        }
      }

      function loadDataFromScript() {
        if (!window.POLYTOPIA_UNITS_DATA || !Array.isArray(window.POLYTOPIA_UNITS_DATA.units)) {
          throw new Error('units.json script data is missing.');
        }

        units = window.POLYTOPIA_UNITS_DATA.units;
        unitMap = new Map(units.map((u) => [u.name, u]));
      }

      attackerSelect.addEventListener('change', () => {
        if (!attackerSelect.value) return;
        appendUnit('attackers', attackerSelect.value);
        attackerSelect.value = '';
      });

      defenderSelect.addEventListener('change', () => {
        if (!defenderSelect.value) return;
        appendUnit('defenders', defenderSelect.value);
        defenderSelect.value = '';
      });

      maximizeAttackersButton.addEventListener('click', () => {
        maximizeAttackerOrder();
      });

      (() => {
        parseStateFromUrl();
        try {
          loadDataFromScript();
          populateSelectors();
          hydrateFromUrlAgainstUnits();
          renderAll();
        } catch (error) {
          loadError.hidden = false;
          loadError.textContent = String(error.message || error);
        }
      })();
    </script>
  </body>
</html>
