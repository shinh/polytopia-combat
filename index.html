<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polytopia Combat Queue UI</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.5;
      }
      body {
        max-width: 1120px;
        margin: 0 auto;
        padding: 1rem;
      }
      * {
        box-sizing: border-box;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .panel {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 0.75rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .row select {
        width: 100%;
      }
      select,
      button,
      input {
        padding: 0.45rem 0.6rem;
        font-size: 1rem;
      }
      .hp-input {
        width: 3.8rem;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        border: 1px solid #b8c2cf;
        background: #f8fafc;
        border-radius: 6px;
        padding: 0.45rem;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto auto auto;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.45rem;
      }
      .unit-summary {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: nowrap;
      }
      .unit-final {
        font-weight: 600;
      }
      .unit-row-neutral {
        background: #eff6ff;
      }
      .unit-row-dead {
        background: #fee4e2;
      }
      .unit-row-poisoned {
        background: #ecfdf3;
      }
      .table-container {
        width: 100%;
        overflow-x: auto;
      }
      .unit-meta {
        font-size: 0.88rem;
        color: #444;
      }
      .controls {
        display: flex;
        gap: 0.45rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .toggle-group {
        display: inline-flex;
        gap: 0.3rem;
        flex-wrap: wrap;
      }
      .toggle-button {
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        background: #f8fafc;
        color: #111827;
        cursor: pointer;
        padding: 0.2rem 0.55rem;
        font-size: 0.85rem;
        line-height: 1.35;
      }
      .toggle-button.is-active {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .move-controls {
        display: flex;
        gap: 0.3rem;
        white-space: nowrap;
      }
      .end-controls {
        display: inline-flex;
        gap: 0.3rem;
        white-space: nowrap;
      }
      .row-break {
        white-space: pre-line;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #e5e7eb;
        padding: 0.4rem;
        text-align: left;
      }
      .error {
        color: #b42318;
        font-weight: 600;
      }
      .event-dead {
        background: #fee4e2;
        color: #b42318;
        font-weight: 600;
      }
      .event-poisoned {
        background: #ecfdf3;
        color: #027a48;
        font-weight: 600;
      }
      .unit-final-dead {
        background: #fee4e2;
        color: #b42318;
        font-weight: 600;
        border-radius: 4px;
        padding: 0.12rem 0.35rem;
        display: inline-block;
      }
      .unit-final-poisoned {
        background: #ecfdf3;
        color: #027a48;
        font-weight: 600;
        border-radius: 4px;
        padding: 0.12rem 0.35rem;
        display: inline-block;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 680px) {
        body {
          padding: 0.75rem;
        }
        h1 {
          font-size: 1.4rem;
        }
        h2 {
          font-size: 1.1rem;
        }
        li {
          grid-template-columns: 1fr;
          align-items: stretch;
        }
        .controls {
          justify-content: flex-start;
        }
        .move-controls {
          justify-content: flex-start;
        }
        .end-controls {
          justify-self: flex-start;
        }
        .hp-input {
          width: 4.4rem;
        }
        th,
        td {
          font-size: 0.92rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>Polytopia Combat Queue UI</h1>
    <p id="loadError" class="error" hidden></p>

    <div class="layout">
      <section class="panel">
        <h2>Defenders</h2>
        <div class="row">
          <select id="defenderSelect"></select>
        </div>
        <ul id="defenderList"></ul>
      </section>

      <section class="panel">
        <h2>Attackers</h2>
        <div class="row">
          <select id="attackerSelect"></select>
          <button id="maximizeAttackersButton" type="button">Maximize</button>
        </div>
        <ul id="attackerList"></ul>
      </section>
    </div>

    <section class="panel" style="margin-top: 1rem">
      <h2>Resolution</h2>
      <div class="table-container">
        <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Defender</th>
            <th>Defender Damage</th>
            <th>Attacker</th>
            <th>Attacker Damage</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
        </table>
      </div>
      <p style="margin-top: 0.75rem">Share URL:</p>
      <p id="shareUrl" class="mono"></p>
    </section>

    <script src="./units.json"></script>
    <script src="./combat.json"></script>
    <script src="./combat.js"></script>
    <script src="./ui-logic.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
