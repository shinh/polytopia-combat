<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polytopia Combat Queue UI</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.5;
      }
      body {
        max-width: 1120px;
        margin: 0 auto;
        padding: 1rem;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .panel {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 0.75rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      select,
      button,
      input {
        padding: 0.35rem 0.5rem;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 0.45rem;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto auto auto auto;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.45rem;
      }
      .unit-meta {
        font-size: 0.88rem;
        color: #444;
      }
      .controls {
        display: flex;
        gap: 0.45rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .move-controls {
        display: flex;
        gap: 0.3rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #e5e7eb;
        padding: 0.4rem;
        text-align: left;
      }
      .error {
        color: #b42318;
        font-weight: 600;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Polytopia Combat Queue UI</h1>
    <p id="loadError" class="error" hidden></p>

    <div class="layout">
      <section class="panel">
        <h2>Attackers</h2>
        <div class="row">
          <select id="attackerSelect"></select>
        </div>
        <ul id="attackerList"></ul>
      </section>

      <section class="panel">
        <h2>Defenders</h2>
        <div class="row">
          <select id="defenderSelect"></select>
        </div>
        <ul id="defenderList"></ul>
      </section>
    </div>

    <section class="panel" style="margin-top: 1rem">
      <h2>Resolution</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Defender</th>
            <th>Initial HP</th>
            <th>Damage Taken (rounded / raw)</th>
            <th>Remaining HP (rounded / raw)</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
      <p style="margin-top: 0.75rem">Share URL:</p>
      <p id="shareUrl" class="mono"></p>
    </section>

    <script src="./units.json"></script>
    <script src="./combat.json"></script>
    <script>
      const state = {
        attackers: [],
        defenders: [],
      };

      let units = [];
      let unitMap = new Map();

      const attackerSelect = document.getElementById('attackerSelect');
      const defenderSelect = document.getElementById('defenderSelect');
      const attackerList = document.getElementById('attackerList');
      const defenderList = document.getElementById('defenderList');
      const resultBody = document.getElementById('resultBody');
      const shareUrl = document.getElementById('shareUrl');
      const loadError = document.getElementById('loadError');

      const DEFENSE_MODES = {
        na: 'na',
        def: 'def',
        wall: 'wall',
      };

      function hasSkill(name, skill) {
        const unit = unitMap.get(name);
        return Boolean(unit && Array.isArray(unit.skills) && unit.skills.includes(skill));
      }

      function canSplash(name) {
        return hasSkill(name, 'splash') || hasSkill(name, 'explode');
      }

      function canWall(name) {
        return hasSkill(name, 'fortify');
      }

      function calcDefenseBonus(defenseMode, pois) {
        const table = pois
          ? { na: 0.5, def: 0.7, wall: 2 }
          : { na: 1, def: 1.5, wall: 4 };
        return table[defenseMode] ?? table.na;
      }

      function normalizeDefenseModeForUnit(name, defenseMode) {
        const wallAllowed = canWall(name);
        if (!wallAllowed && defenseMode === DEFENSE_MODES.wall) {
          return DEFENSE_MODES.def;
        }
        if (defenseMode === DEFENSE_MODES.na || defenseMode === DEFENSE_MODES.def || defenseMode === DEFENSE_MODES.wall) {
          return defenseMode;
        }
        return DEFENSE_MODES.na;
      }

      function parseStateFromUrl() {
        const params = new URLSearchParams(window.location.search);
        state.attackers = parseGroup(params.get('a'), 'attacker');
        state.defenders = parseGroup(params.get('d'), 'defender');
      }

      function parseGroup(raw, side) {
        if (!raw) return [];
        return raw
          .split(',')
          .map((item) => item.trim())
          .filter(Boolean)
          .map((item) => {
            const [encodedName, hpRaw, p3, p4] = item.split(':');
            const name = decodeURIComponent(encodedName || '');
            const hp = Number.parseFloat(hpRaw);

            if (side === 'attacker') {
              return {
                name,
                hp,
                splash: p3 === '1',
              };
            }

            return {
              name,
              hp,
              defenseMode: p3 || DEFENSE_MODES.na,
              pois: p4 === '1',
            };
          })
          .filter((u) => u.name);
      }

      function serializeGroup(group, side) {
        return group
          .map((unit) => {
            const encodedName = encodeURIComponent(unit.name);
            const hp = Math.max(0, unit.hp);
            if (side === 'attackers') {
              return `${encodedName}:${hp}:${unit.splash ? '1' : '0'}`;
            }

            const defenseMode = normalizeDefenseModeForUnit(unit.name, unit.defenseMode || DEFENSE_MODES.na);
            return `${encodedName}:${hp}:${defenseMode}:${unit.pois ? '1' : '0'}`;
          })
          .join(',');
      }

      function syncUrl() {
        const params = new URLSearchParams();
        params.set('a', serializeGroup(state.attackers, 'attackers'));
        params.set('d', serializeGroup(state.defenders, 'defenders'));
        const next = `${window.location.pathname}?${params.toString()}`;
        history.replaceState(null, '', next);
        shareUrl.textContent = window.location.href;
      }

      function makeUnitSnapshot(name) {
        const base = unitMap.get(name);
        if (!base) return null;
        return { name: base.name, hp: base.health, maxHp: base.health, attack: base.attack, defense: base.defence };
      }

      function clampHp(hp, maxHp) {
        return Math.max(0, Math.min(maxHp, hp));
      }

      function moveUnit(group, index, delta) {
        const target = index + delta;
        if (target < 0 || target >= group.length) return;
        const copy = group[index];
        group[index] = group[target];
        group[target] = copy;
        renderAll();
      }

      function renderGroup(container, group, side) {
        container.innerHTML = '';
        group.forEach((unit, index) => {
          const li = document.createElement('li');

          const left = document.createElement('div');
          const label = document.createElement('div');
          label.textContent = `${unit.name} (HP ${unit.hp})`;
          const meta = document.createElement('div');
          meta.className = 'unit-meta';
          if (side === 'attackers') {
            meta.textContent = `splash: ${unit.splash ? 'on' : 'off'}`;
          } else {
            const bonus = calcDefenseBonus(unit.defenseMode, unit.pois);
            meta.textContent = `terrain: ${unit.defenseMode}, pois: ${unit.pois ? 'on' : 'off'}, bonus: x${bonus}`;
          }
          left.append(label, meta);

          const hpInput = document.createElement('input');
          hpInput.type = 'number';
          hpInput.min = '0';
          hpInput.step = '1';
          hpInput.value = String(unit.hp);
          hpInput.addEventListener('change', () => {
            const snapshot = makeUnitSnapshot(unit.name);
            if (!snapshot) return;
            const value = Math.max(0, Math.round(Number.parseFloat(hpInput.value) || 0));
            unit.hp = clampHp(value, snapshot.maxHp);
            renderAll();
          });

          const controls = document.createElement('div');
          controls.className = 'controls';
          if (side === 'attackers') {
            if (canSplash(unit.name)) {
              const splashLabel = document.createElement('label');
              const splashInput = document.createElement('input');
              splashInput.type = 'checkbox';
              splashInput.checked = Boolean(unit.splash);
              splashInput.addEventListener('change', () => {
                unit.splash = splashInput.checked;
                renderAll();
              });
              splashLabel.append(splashInput, ' splash');
              controls.appendChild(splashLabel);
            } else {
              unit.splash = false;
              const noSplash = document.createElement('span');
              noSplash.className = 'unit-meta';
              noSplash.textContent = 'no splash/explode skill';
              controls.appendChild(noSplash);
            }
          } else {
            const defenseMode = normalizeDefenseModeForUnit(unit.name, unit.defenseMode);
            unit.defenseMode = defenseMode;

            const defenseSelect = document.createElement('select');
            const options = canWall(unit.name)
              ? [DEFENSE_MODES.na, DEFENSE_MODES.def, DEFENSE_MODES.wall]
              : [DEFENSE_MODES.na, DEFENSE_MODES.def];
            options.forEach((key) => {
              const option = document.createElement('option');
              option.value = key;
              option.textContent = key;
              defenseSelect.appendChild(option);
            });
            defenseSelect.value = defenseMode;
            defenseSelect.addEventListener('change', () => {
              unit.defenseMode = defenseSelect.value;
              renderAll();
            });

            const poisLabel = document.createElement('label');
            const poisInput = document.createElement('input');
            poisInput.type = 'checkbox';
            poisInput.checked = Boolean(unit.pois);
            poisInput.addEventListener('change', () => {
              unit.pois = poisInput.checked;
              renderAll();
            });
            poisLabel.append(poisInput, ' pois');

            controls.append('defense ', defenseSelect, poisLabel);
          }

          const moveControls = document.createElement('div');
          moveControls.className = 'move-controls';
          const upButton = document.createElement('button');
          upButton.textContent = '↑';
          upButton.title = 'Move up';
          upButton.disabled = index === 0;
          upButton.addEventListener('click', () => moveUnit(group, index, -1));

          const downButton = document.createElement('button');
          downButton.textContent = '↓';
          downButton.title = 'Move down';
          downButton.disabled = index === group.length - 1;
          downButton.addEventListener('click', () => moveUnit(group, index, 1));
          moveControls.append(upButton, downButton);

          const removeButton = document.createElement('button');
          removeButton.textContent = 'Remove';
          removeButton.addEventListener('click', () => {
            group.splice(index, 1);
            renderAll();
          });

          li.append(left, hpInput, controls, moveControls, removeButton);
          container.appendChild(li);
        });

        if (group.length === 0) {
          const empty = document.createElement('li');
          empty.textContent = `No ${side} yet`;
          container.appendChild(empty);
        }
      }

      function simulateCombat(attacker, defender, splash = false) {
        const attackForce = attacker.attack * (attacker.hp / attacker.maxHp);
        const defenseForce = defender.defense * (defender.hp / defender.maxHp) * defender.defenseBonus;
        const totalDamage = attackForce + defenseForce;
        const attackDamageRaw = (attackForce / totalDamage) * attacker.attack * 4.5;
        const attackResult = Math.round(attackDamageRaw);

        if (splash) {
          const splashRaw = attackDamageRaw / 2;
          return {
            attackerHp: attacker.hp,
            attackerHpRaw: attacker.hp,
            defenderHp: clampHp(defender.hp - attackResult / 2, defender.maxHp),
            defenderHpRaw: clampHp(defender.hp - splashRaw, defender.maxHp),
            attackDamageRaw,
            defenseDamageRaw: 0,
          };
        }

        const defenderHpAfter = clampHp(defender.hp - attackResult, defender.maxHp);
        const defenderHpRaw = clampHp(defender.hp - attackDamageRaw, defender.maxHp);
        let attackerHpAfter = attacker.hp;
        let attackerHpRaw = attacker.hp;
        let defenseDamageRaw = 0;

        if (defenderHpAfter > 0) {
          defenseDamageRaw = (defenseForce / totalDamage) * defender.defense * 4.5;
          const defenseResult = Math.round(defenseDamageRaw);
          attackerHpAfter = clampHp(attacker.hp - defenseResult, attacker.maxHp);
          attackerHpRaw = clampHp(attacker.hp - defenseDamageRaw, attacker.maxHp);
        }
        return {
          attackerHp: attackerHpAfter,
          attackerHpRaw,
          defenderHp: defenderHpAfter,
          defenderHpRaw,
          attackDamageRaw,
          defenseDamageRaw,
        };
      }

      function computeQueueResult() {
        const attackerUnits = state.attackers
          .map((u) => {
            const snapshot = makeUnitSnapshot(u.name);
            if (!snapshot) return null;
            return {
              ...snapshot,
              hp: clampHp(u.hp, snapshot.maxHp),
              splash: Boolean(u.splash && canSplash(u.name)),
            };
          })
          .filter(Boolean);

        const defenderUnits = state.defenders
          .map((u) => {
            const snapshot = makeUnitSnapshot(u.name);
            if (!snapshot) return null;
            const mode = normalizeDefenseModeForUnit(u.name, u.defenseMode);
            const pois = Boolean(u.pois);
            return {
              ...snapshot,
              hp: clampHp(u.hp, snapshot.maxHp),
              initialHp: clampHp(u.hp, snapshot.maxHp),
              hpRaw: clampHp(u.hp, snapshot.maxHp),
              initialHpRaw: clampHp(u.hp, snapshot.maxHp),
              defenseMode: mode,
              pois,
              defenseBonus: calcDefenseBonus(mode, pois),
            };
          })
          .filter(Boolean);

        let defenderIndex = 0;
        for (const attacker of attackerUnits) {
          while (defenderIndex < defenderUnits.length && defenderUnits[defenderIndex].hp <= 0) {
            defenderIndex += 1;
          }
          if (defenderIndex >= defenderUnits.length) break;

          const target = defenderUnits[defenderIndex];
          const result = simulateCombat(attacker, target, attacker.splash);
          attacker.hp = result.attackerHp;
          target.hp = result.defenderHp;
          target.hpRaw = result.defenderHpRaw;
        }

        return defenderUnits;
      }

      function renderResult() {
        resultBody.innerHTML = '';
        const defenders = computeQueueResult();

        defenders.forEach((defender, idx) => {
          const tr = document.createElement('tr');
          const damageTaken = defender.initialHp - defender.hp;
          const damageTakenRaw = defender.initialHpRaw - defender.hpRaw;
          tr.innerHTML = `
            <td>${idx + 1}</td>
            <td>${defender.name}</td>
            <td>${defender.initialHp}</td>
            <td>${damageTaken} / ${damageTakenRaw.toFixed(2)}</td>
            <td>${defender.hp} / ${defender.hpRaw.toFixed(2)}</td>
          `;
          resultBody.appendChild(tr);
        });

        if (defenders.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="5">No defenders selected</td>';
          resultBody.appendChild(tr);
        }
      }

      function renderAll() {
        renderGroup(attackerList, state.attackers, 'attackers');
        renderGroup(defenderList, state.defenders, 'defenders');
        renderResult();
        syncUrl();
      }

      function appendUnit(side, selectedName) {
        const snapshot = makeUnitSnapshot(selectedName);
        if (!snapshot) return;

        if (side === 'attackers') {
          state.attackers.push({ name: snapshot.name, hp: snapshot.maxHp, splash: false });
        } else {
          state.defenders.push({ name: snapshot.name, hp: snapshot.maxHp, defenseMode: DEFENSE_MODES.na, pois: false });
        }

        renderAll();
      }

      function hydrateFromUrlAgainstUnits() {
        state.attackers = state.attackers
          .map((u) => {
            const base = makeUnitSnapshot(u.name);
            if (!base) return null;
            return {
              name: u.name,
              hp: Number.isNaN(u.hp) ? base.maxHp : clampHp(Math.round(u.hp), base.maxHp),
              splash: Boolean(u.splash && canSplash(u.name)),
            };
          })
          .filter(Boolean);

        state.defenders = state.defenders
          .map((u) => {
            const base = makeUnitSnapshot(u.name);
            if (!base) return null;
            return {
              name: u.name,
              hp: Number.isNaN(u.hp) ? base.maxHp : clampHp(Math.round(u.hp), base.maxHp),
              defenseMode: normalizeDefenseModeForUnit(u.name, u.defenseMode || DEFENSE_MODES.na),
              pois: Boolean(u.pois),
            };
          })
          .filter(Boolean);
      }

      function populateSelectors() {
        for (const select of [attackerSelect, defenderSelect]) {
          select.innerHTML = '';
          const placeholder = document.createElement('option');
          placeholder.value = '';
          placeholder.textContent = 'Select a unit';
          placeholder.selected = true;
          select.appendChild(placeholder);

          units.forEach((unit) => {
            const option = document.createElement('option');
            option.value = unit.name;
            option.textContent = `${unit.name} (HP ${unit.health}, ATK ${unit.attack}, DEF ${unit.defence})`;
            select.appendChild(option);
          });
        }
      }

      function loadDataFromScript() {
        if (!window.POLYTOPIA_UNITS_DATA || !Array.isArray(window.POLYTOPIA_UNITS_DATA.units)) {
          throw new Error('units.json script data is missing.');
        }

        units = window.POLYTOPIA_UNITS_DATA.units.filter((u) => Number.isFinite(u.health));
        unitMap = new Map(units.map((u) => [u.name, u]));
      }

      attackerSelect.addEventListener('change', () => {
        if (!attackerSelect.value) return;
        appendUnit('attackers', attackerSelect.value);
        attackerSelect.value = '';
      });

      defenderSelect.addEventListener('change', () => {
        if (!defenderSelect.value) return;
        appendUnit('defenders', defenderSelect.value);
        defenderSelect.value = '';
      });

      (() => {
        parseStateFromUrl();
        try {
          loadDataFromScript();
          populateSelectors();
          hydrateFromUrlAgainstUnits();
          renderAll();
        } catch (error) {
          loadError.hidden = false;
          loadError.textContent = String(error.message || error);
        }
      })();
    </script>
  </body>
</html>
