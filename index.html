<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polytopia Combat Queue UI</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.5;
      }
      body {
        max-width: 1000px;
        margin: 0 auto;
        padding: 1rem;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .panel {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 0.75rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      select,
      button,
      input {
        padding: 0.35rem 0.5rem;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 0.45rem;
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.45rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #e5e7eb;
        padding: 0.4rem;
        text-align: left;
      }
      .error {
        color: #b42318;
        font-weight: 600;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      @media (max-width: 800px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Polytopia Combat Queue UI</h1>
    <p>
      attacker は順番に、先頭で生存している defender を攻撃します。defender の HP が 0 なら次の defender
      に進みます。状態は URL クエリに保存されます。
    </p>
    <p id="loadError" class="error" hidden></p>

    <div class="layout">
      <section class="panel">
        <h2>Attackers</h2>
        <div class="row">
          <select id="attackerSelect"></select>
          <button id="addAttacker">Add attacker</button>
        </div>
        <ul id="attackerList"></ul>
      </section>

      <section class="panel">
        <h2>Defenders</h2>
        <div class="row">
          <select id="defenderSelect"></select>
          <button id="addDefender">Add defender</button>
        </div>
        <ul id="defenderList"></ul>
      </section>
    </div>

    <section class="panel" style="margin-top: 1rem">
      <h2>Options</h2>
      <label>
        defenseBonus:
        <input id="defenseBonus" type="number" step="0.1" min="0" value="1" />
      </label>
      <label style="margin-left: 1rem">
        <input id="splash" type="checkbox" /> splash
      </label>
    </section>

    <section class="panel" style="margin-top: 1rem">
      <h2>Resolution</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Defender</th>
            <th>Initial HP</th>
            <th>Damage Taken</th>
            <th>Remaining HP</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
      <p style="margin-top: 0.75rem">Share URL:</p>
      <p id="shareUrl" class="mono"></p>
    </section>

    <script src="./units.json"></script>
    <script src="./combat.json"></script>
    <script>
      const state = {
        attackers: [],
        defenders: [],
        defenseBonus: 1,
        splash: false,
      };

      let units = [];
      let unitMap = new Map();

      const attackerSelect = document.getElementById('attackerSelect');
      const defenderSelect = document.getElementById('defenderSelect');
      const attackerList = document.getElementById('attackerList');
      const defenderList = document.getElementById('defenderList');
      const defenseBonusInput = document.getElementById('defenseBonus');
      const splashInput = document.getElementById('splash');
      const resultBody = document.getElementById('resultBody');
      const shareUrl = document.getElementById('shareUrl');
      const loadError = document.getElementById('loadError');

      function parseStateFromUrl() {
        const params = new URLSearchParams(window.location.search);
        state.attackers = parseGroup(params.get('a'));
        state.defenders = parseGroup(params.get('d'));
        const parsedDefenseBonus = Number.parseFloat(params.get('db'));
        if (!Number.isNaN(parsedDefenseBonus) && parsedDefenseBonus >= 0) {
          state.defenseBonus = parsedDefenseBonus;
        }
        state.splash = params.get('sp') === '1';
      }

      function parseGroup(raw) {
        if (!raw) return [];
        return raw
          .split(',')
          .map((item) => item.trim())
          .filter(Boolean)
          .map((item) => {
            const [encodedName, hpRaw] = item.split(':');
            return {
              name: decodeURIComponent(encodedName || ''),
              hp: Number.parseFloat(hpRaw),
            };
          })
          .filter((u) => u.name);
      }

      function syncUrl() {
        const params = new URLSearchParams();
        params.set('a', serializeGroup(state.attackers));
        params.set('d', serializeGroup(state.defenders));
        params.set('db', String(state.defenseBonus));
        if (state.splash) {
          params.set('sp', '1');
        }
        const next = `${window.location.pathname}?${params.toString()}`;
        history.replaceState(null, '', next);
        shareUrl.textContent = window.location.href;
      }

      function serializeGroup(group) {
        return group
          .map((unit) => `${encodeURIComponent(unit.name)}:${Math.max(0, unit.hp)}`)
          .join(',');
      }

      function makeUnitSnapshot(name) {
        const base = unitMap.get(name);
        if (!base) return null;
        return { name: base.name, hp: base.health, maxHp: base.health, attack: base.attack, defense: base.defence };
      }

      function renderGroup(container, group, side) {
        container.innerHTML = '';
        group.forEach((unit, index) => {
          const li = document.createElement('li');
          const label = document.createElement('span');
          label.textContent = `${unit.name} (HP ${unit.hp})`;

          const hpInput = document.createElement('input');
          hpInput.type = 'number';
          hpInput.min = '0';
          hpInput.step = '1';
          hpInput.value = String(unit.hp);
          hpInput.addEventListener('change', () => {
            const value = Math.max(0, Math.round(Number.parseFloat(hpInput.value) || 0));
            unit.hp = value;
            renderAll();
          });

          const removeButton = document.createElement('button');
          removeButton.textContent = 'Remove';
          removeButton.addEventListener('click', () => {
            group.splice(index, 1);
            renderAll();
          });

          li.append(label, hpInput, removeButton);
          container.appendChild(li);
        });

        if (group.length === 0) {
          const empty = document.createElement('li');
          empty.textContent = `No ${side} yet`;
          container.appendChild(empty);
        }
      }

      function simulateCombat(attacker, defender, splash = false, defenseBonus = 1) {
        const attackForce = attacker.attack * (attacker.hp / attacker.maxHp);
        const defenseForce = defender.defense * (defender.hp / defender.maxHp) * defenseBonus;
        const totalDamage = attackForce + defenseForce;
        const attackResult = Math.round((attackForce / totalDamage) * attacker.attack * 4.5);

        if (splash) {
          return {
            attackerHp: attacker.hp,
            defenderHp: clampHp(defender.hp - attackResult / 2, defender.maxHp),
          };
        }

        const defenderHpAfter = clampHp(defender.hp - attackResult, defender.maxHp);
        let attackerHpAfter = attacker.hp;
        if (defenderHpAfter > 0) {
          const defenseResult = Math.round((defenseForce / totalDamage) * defender.defense * 4.5);
          attackerHpAfter = clampHp(attacker.hp - defenseResult, attacker.maxHp);
        }
        return { attackerHp: attackerHpAfter, defenderHp: defenderHpAfter };
      }

      function clampHp(hp, maxHp) {
        return Math.max(0, Math.min(maxHp, hp));
      }

      function computeQueueResult() {
        const attackerUnits = state.attackers.map((u) => {
          const snapshot = makeUnitSnapshot(u.name);
          return snapshot ? { ...snapshot, hp: clampHp(u.hp, snapshot.maxHp) } : null;
        }).filter(Boolean);

        const defenderUnits = state.defenders.map((u) => {
          const snapshot = makeUnitSnapshot(u.name);
          return snapshot ? { ...snapshot, hp: clampHp(u.hp, snapshot.maxHp), initialHp: clampHp(u.hp, snapshot.maxHp) } : null;
        }).filter(Boolean);

        let defenderIndex = 0;
        for (const attacker of attackerUnits) {
          while (defenderIndex < defenderUnits.length && defenderUnits[defenderIndex].hp <= 0) {
            defenderIndex += 1;
          }
          if (defenderIndex >= defenderUnits.length) break;

          const target = defenderUnits[defenderIndex];
          const result = simulateCombat(attacker, target, state.splash, state.defenseBonus);
          attacker.hp = result.attackerHp;
          target.hp = result.defenderHp;
        }

        return defenderUnits;
      }

      function renderResult() {
        resultBody.innerHTML = '';
        const defenders = computeQueueResult();

        defenders.forEach((defender, idx) => {
          const tr = document.createElement('tr');
          const damageTaken = defender.initialHp - defender.hp;
          tr.innerHTML = `
            <td>${idx + 1}</td>
            <td>${defender.name}</td>
            <td>${defender.initialHp}</td>
            <td>${damageTaken}</td>
            <td>${defender.hp}</td>
          `;
          resultBody.appendChild(tr);
        });

        if (defenders.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="5">No defenders selected</td>';
          resultBody.appendChild(tr);
        }
      }

      function renderAll() {
        defenseBonusInput.value = String(state.defenseBonus);
        splashInput.checked = state.splash;
        renderGroup(attackerList, state.attackers, 'attackers');
        renderGroup(defenderList, state.defenders, 'defenders');
        renderResult();
        syncUrl();
      }

      function appendUnit(side, selectedName) {
        const snapshot = makeUnitSnapshot(selectedName);
        if (!snapshot) return;
        state[side].push({ name: snapshot.name, hp: snapshot.maxHp });
        renderAll();
      }

      function hydrateFromUrlAgainstUnits() {
        for (const key of ['attackers', 'defenders']) {
          state[key] = state[key]
            .map((u) => {
              const base = makeUnitSnapshot(u.name);
              if (!base) return null;
              const hp = Number.isNaN(u.hp) ? base.maxHp : clampHp(Math.round(u.hp), base.maxHp);
              return { name: u.name, hp };
            })
            .filter(Boolean);
        }
      }

      function populateSelectors() {
        for (const select of [attackerSelect, defenderSelect]) {
          select.innerHTML = '';
          units.forEach((unit) => {
            const option = document.createElement('option');
            option.value = unit.name;
            option.textContent = `${unit.name} (HP ${unit.health}, ATK ${unit.attack}, DEF ${unit.defence})`;
            select.appendChild(option);
          });
        }
      }

      function loadDataFromScript() {
        if (!window.POLYTOPIA_UNITS_DATA || !Array.isArray(window.POLYTOPIA_UNITS_DATA.units)) {
          throw new Error('units.json script data is missing.');
        }

        units = window.POLYTOPIA_UNITS_DATA.units.filter((u) => Number.isFinite(u.health));
        unitMap = new Map(units.map((u) => [u.name, u]));

        const config = window.POLYTOPIA_COMBAT_CONFIG || {};
        if (typeof config.defaultDefenseBonus === 'number') {
          state.defenseBonus = config.defaultDefenseBonus;
        }
        if (typeof config.defaultSplash === 'boolean') {
          state.splash = config.defaultSplash;
        }
      }

      document.getElementById('addAttacker').addEventListener('click', () => {
        appendUnit('attackers', attackerSelect.value);
      });
      document.getElementById('addDefender').addEventListener('click', () => {
        appendUnit('defenders', defenderSelect.value);
      });
      defenseBonusInput.addEventListener('input', () => {
        state.defenseBonus = Math.max(0, Number.parseFloat(defenseBonusInput.value) || 0);
        renderAll();
      });
      splashInput.addEventListener('change', () => {
        state.splash = splashInput.checked;
        renderAll();
      });

      (() => {
        parseStateFromUrl();
        try {
          loadDataFromScript();
          populateSelectors();
          hydrateFromUrlAgainstUnits();
          renderAll();
        } catch (error) {
          loadError.hidden = false;
          loadError.textContent = String(error.message || error);
        }
      })();
    </script>
  </body>
</html>
