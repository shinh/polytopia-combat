<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polytopia Combat Queue UI</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.5;
      }
      body {
        max-width: 1120px;
        margin: 0 auto;
        padding: 1rem;
      }
      * {
        box-sizing: border-box;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .panel {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 0.75rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .row select {
        width: 100%;
      }
      select,
      button,
      input {
        padding: 0.45rem 0.6rem;
        font-size: 1rem;
      }
      .hp-input {
        width: 4.5rem;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 0.45rem;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto auto auto auto;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.45rem;
      }
      .table-container {
        width: 100%;
        overflow-x: auto;
      }
      .unit-meta {
        font-size: 0.88rem;
        color: #444;
      }
      .controls {
        display: flex;
        gap: 0.45rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .move-controls {
        display: flex;
        gap: 0.3rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #e5e7eb;
        padding: 0.4rem;
        text-align: left;
      }
      .error {
        color: #b42318;
        font-weight: 600;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 680px) {
        body {
          padding: 0.75rem;
        }
        h1 {
          font-size: 1.4rem;
        }
        h2 {
          font-size: 1.1rem;
        }
        li {
          grid-template-columns: 1fr;
          align-items: stretch;
        }
        .controls {
          justify-content: flex-start;
        }
        .move-controls {
          justify-content: flex-start;
        }
        .hp-input {
          width: 100%;
        }
        th,
        td {
          white-space: nowrap;
          font-size: 0.92rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>Polytopia Combat Queue UI</h1>
    <p id="loadError" class="error" hidden></p>

    <div class="layout">
      <section class="panel">
        <h2>Attackers</h2>
        <div class="row">
          <select id="attackerSelect"></select>
        </div>
        <ul id="attackerList"></ul>
      </section>

      <section class="panel">
        <h2>Defenders</h2>
        <div class="row">
          <select id="defenderSelect"></select>
        </div>
        <ul id="defenderList"></ul>
      </section>
    </div>

    <section class="panel" style="margin-top: 1rem">
      <h2>Resolution</h2>
      <div class="table-container">
        <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Attacker</th>
            <th>Attacker Damage</th>
            <th>Defender</th>
            <th>Defender Damage</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
        </table>
      </div>
      <p style="margin-top: 0.75rem">Share URL:</p>
      <p id="shareUrl" class="mono"></p>
    </section>

    <script src="./units.json"></script>
    <script src="./combat.json"></script>
    <script src="./combat.js"></script>
    <script>
      const state = {
        attackers: [],
        defenders: [],
      };

      let units = [];
      let unitMap = new Map();

      const attackerSelect = document.getElementById('attackerSelect');
      const defenderSelect = document.getElementById('defenderSelect');
      const attackerList = document.getElementById('attackerList');
      const defenderList = document.getElementById('defenderList');
      const resultBody = document.getElementById('resultBody');
      const shareUrl = document.getElementById('shareUrl');
      const loadError = document.getElementById('loadError');
      const combatEngine = window.POLYTOPIA_COMBAT;

      const DEFENSE_MODES = {
        na: 'na',
        def: 'def',
        wall: 'wall',
      };

      function hasSkill(name, skill) {
        const unit = unitMap.get(name);
        return Boolean(unit && Array.isArray(unit.skills) && unit.skills.includes(skill));
      }

      function canSplash(name) {
        return hasSkill(name, 'splash') || hasSkill(name, 'explode');
      }

      function canWall(name) {
        return hasSkill(name, 'fortify');
      }

      function canVet(name) {
        const unit = unitMap.get(name);
        return Boolean(unit && unit.veteran);
      }

      function canHp10(name) {
        const unit = unitMap.get(name);
        return Boolean(unit && unit.health === null);
      }

      function calcDefenseBonus(defenseMode, pois) {
        const table = pois
          ? { na: 0.5, def: 0.7, wall: 2 }
          : { na: 1, def: 1.5, wall: 4 };
        return table[defenseMode] ?? table.na;
      }

      function normalizeDefenseModeForUnit(name, defenseMode) {
        const wallAllowed = canWall(name);
        if (!wallAllowed && defenseMode === DEFENSE_MODES.wall) {
          return DEFENSE_MODES.def;
        }
        if (defenseMode === DEFENSE_MODES.na || defenseMode === DEFENSE_MODES.def || defenseMode === DEFENSE_MODES.wall) {
          return defenseMode;
        }
        return DEFENSE_MODES.na;
      }

      function parseStateFromUrl() {
        const params = new URLSearchParams(window.location.search);
        state.attackers = parseGroup(params.get('a'), 'attacker');
        state.defenders = parseGroup(params.get('d'), 'defender');
      }

      function parseGroup(raw, side) {
        if (!raw) return [];
        return raw
          .split(',')
          .map((item) => item.trim())
          .filter(Boolean)
          .map((item) => {
            const [encodedName, hpRaw, p3, p4, p5, p6] = item.split(':');
            const name = decodeURIComponent(encodedName || '');
            const hp = Number.parseFloat(hpRaw);

            if (side === 'attacker') {
              return {
                name,
                hp,
                splash: p3 === '1',
                vet: p4 === '1',
                hp10: p5 === '1',
              };
            }

            return {
              name,
              hp,
              defenseMode: p3 || DEFENSE_MODES.na,
              pois: p4 === '1',
              vet: p5 === '1',
              hp10: p6 === '1',
            };
          })
          .filter((u) => u.name);
      }

      function serializeGroup(group, side) {
        return group
          .map((unit) => {
            const encodedName = encodeURIComponent(unit.name);
            const hp = Math.max(0, unit.hp);
            if (side === 'attackers') {
              return `${encodedName}:${hp}:${unit.splash ? '1' : '0'}:${unit.vet ? '1' : '0'}:${unit.hp10 ? '1' : '0'}`;
            }

            const defenseMode = normalizeDefenseModeForUnit(unit.name, unit.defenseMode || DEFENSE_MODES.na);
            return `${encodedName}:${hp}:${defenseMode}:${unit.pois ? '1' : '0'}:${unit.vet ? '1' : '0'}:${unit.hp10 ? '1' : '0'}`;
          })
          .join(',');
      }

      function syncUrl() {
        const params = new URLSearchParams();
        params.set('a', serializeGroup(state.attackers, 'attackers'));
        params.set('d', serializeGroup(state.defenders, 'defenders'));
        const next = `${window.location.pathname}?${params.toString()}`;
        history.replaceState(null, '', next);
        shareUrl.textContent = window.location.href;
      }

      function makeUnitSnapshot(name, options = {}) {
        const base = unitMap.get(name);
        if (!base) return null;
        const hpBase = Number.isFinite(base.health) ? base.health : (options.hp10 ? 10 : 15);
        const maxHp = options.vet && base.veteran ? hpBase * 1.5 : hpBase;
        return { name: base.name, hp: maxHp, maxHp, attack: base.attack, defense: base.defence };
      }

      function clampHp(hp, maxHp) {
        return Math.max(0, Math.min(maxHp, hp));
      }

      function moveUnit(group, index, delta) {
        const target = index + delta;
        if (target < 0 || target >= group.length) return;
        const copy = group[index];
        group[index] = group[target];
        group[target] = copy;
        renderAll();
      }

      function renderGroup(container, group, side) {
        container.innerHTML = '';
        group.forEach((unit, index) => {
          const li = document.createElement('li');
          const snapshot = makeUnitSnapshot(unit.name, unit);
          if (!snapshot) return;

          const left = document.createElement('div');
          const label = document.createElement('div');
          label.textContent = formatUnitSummary(snapshot, unit.hp);
          const meta = document.createElement('div');
          meta.className = 'unit-meta';
          if (side === 'defenders') {
            const bonus = calcDefenseBonus(unit.defenseMode, unit.pois);
            meta.textContent = `bonus: x${bonus}`;
          }
          left.append(label);
          if (meta.textContent) {
            left.append(meta);
          }

          const hpInput = document.createElement('input');
          hpInput.className = 'hp-input';
          hpInput.type = 'number';
          hpInput.min = '0';
          hpInput.step = '1';
          hpInput.value = String(unit.hp);
          hpInput.addEventListener('change', () => {
            const value = Math.max(0, Math.round(Number.parseFloat(hpInput.value) || 0));
            unit.hp = clampHp(value, snapshot.maxHp);
            renderAll();
          });

          const controls = document.createElement('div');
          controls.className = 'controls';
          if (side === 'attackers') {
            if (canSplash(unit.name)) {
              const splashLabel = document.createElement('label');
              const splashInput = document.createElement('input');
              splashInput.type = 'checkbox';
              splashInput.checked = Boolean(unit.splash);
              splashInput.addEventListener('change', () => {
                unit.splash = splashInput.checked;
                renderAll();
              });
              splashLabel.append(splashInput, ' splash');
              controls.appendChild(splashLabel);
            }
            unit.splash = Boolean(unit.splash && canSplash(unit.name));
          } else {
            const defenseMode = normalizeDefenseModeForUnit(unit.name, unit.defenseMode);
            unit.defenseMode = defenseMode;

            const defenseSelect = document.createElement('select');
            const options = canWall(unit.name)
              ? [DEFENSE_MODES.na, DEFENSE_MODES.def, DEFENSE_MODES.wall]
              : [DEFENSE_MODES.na, DEFENSE_MODES.def];
            options.forEach((key) => {
              const option = document.createElement('option');
              option.value = key;
              option.textContent = key;
              defenseSelect.appendChild(option);
            });
            defenseSelect.value = defenseMode;
            defenseSelect.addEventListener('change', () => {
              unit.defenseMode = defenseSelect.value;
              renderAll();
            });

            const poisLabel = document.createElement('label');
            const poisInput = document.createElement('input');
            poisInput.type = 'checkbox';
            poisInput.checked = Boolean(unit.pois);
            poisInput.addEventListener('change', () => {
              unit.pois = poisInput.checked;
              renderAll();
            });
            poisLabel.append(poisInput, ' pois');

            controls.append('defense ', defenseSelect, poisLabel);
          }

          if (canVet(unit.name)) {
            const vetLabel = document.createElement('label');
            const vetInput = document.createElement('input');
            vetInput.type = 'checkbox';
            vetInput.checked = Boolean(unit.vet);
            vetInput.addEventListener('change', () => {
              unit.vet = vetInput.checked;
              const nextSnapshot = makeUnitSnapshot(unit.name, unit);
              if (nextSnapshot) {
                unit.hp = clampHp(unit.hp, nextSnapshot.maxHp);
              }
              renderAll();
            });
            vetLabel.append(vetInput, ' vet');
            controls.appendChild(vetLabel);
          } else {
            unit.vet = false;
          }

          if (canHp10(unit.name)) {
            const hp10Label = document.createElement('label');
            const hp10Input = document.createElement('input');
            hp10Input.type = 'checkbox';
            hp10Input.checked = Boolean(unit.hp10);
            hp10Input.addEventListener('change', () => {
              unit.hp10 = hp10Input.checked;
              const nextSnapshot = makeUnitSnapshot(unit.name, unit);
              if (nextSnapshot) {
                unit.hp = clampHp(unit.hp, nextSnapshot.maxHp);
              }
              renderAll();
            });
            hp10Label.append(hp10Input, ' hp10');
            controls.appendChild(hp10Label);
          } else {
            unit.hp10 = false;
          }

          const moveControls = document.createElement('div');
          moveControls.className = 'move-controls';
          const upButton = document.createElement('button');
          upButton.textContent = '↑';
          upButton.title = 'Move up';
          upButton.disabled = index === 0;
          upButton.addEventListener('click', () => moveUnit(group, index, -1));

          const downButton = document.createElement('button');
          downButton.textContent = '↓';
          downButton.title = 'Move down';
          downButton.disabled = index === group.length - 1;
          downButton.addEventListener('click', () => moveUnit(group, index, 1));
          moveControls.append(upButton, downButton);

          const removeButton = document.createElement('button');
          removeButton.textContent = 'DEL';
          removeButton.addEventListener('click', () => {
            group.splice(index, 1);
            renderAll();
          });

          li.append(left, hpInput, controls, moveControls, removeButton);
          container.appendChild(li);
        });

        if (group.length === 0) {
          const empty = document.createElement('li');
          empty.textContent = `No ${side} yet`;
          container.appendChild(empty);
        }
      }

      function computeQueueResult() {
        if (!combatEngine || typeof combatEngine.calculateCombatExchange !== 'function') {
          throw new Error('combat.js did not expose calculateCombatExchange.');
        }

        const attackerUnits = state.attackers
          .map((u) => {
          const snapshot = makeUnitSnapshot(u.name, u);
          if (!snapshot) return null;
          return {
            ...snapshot,
              hp: clampHp(u.hp, snapshot.maxHp),
              splash: Boolean(u.splash && canSplash(u.name)),
            };
          })
          .filter(Boolean);

        const defenderUnits = state.defenders
          .map((u) => {
          const snapshot = makeUnitSnapshot(u.name, u);
          if (!snapshot) return null;
            const mode = normalizeDefenseModeForUnit(u.name, u.defenseMode);
            const pois = Boolean(u.pois);
            return {
              ...snapshot,
              hp: clampHp(u.hp, snapshot.maxHp),
              initialHp: clampHp(u.hp, snapshot.maxHp),
              hpRaw: clampHp(u.hp, snapshot.maxHp),
              initialHpRaw: clampHp(u.hp, snapshot.maxHp),
              defenseMode: mode,
              pois,
              defenseBonus: calcDefenseBonus(mode, pois),
            };
          })
          .filter(Boolean);

        const rounds = [];
        let defenderIndex = 0;
        attackerUnits.forEach((attacker, attackerIndex) => {
          while (defenderIndex < defenderUnits.length && defenderUnits[defenderIndex].hp <= 0) {
            defenderIndex += 1;
          }
          if (defenderIndex >= defenderUnits.length) {
            rounds.push({
              index: attackerIndex + 1,
              attackerLabel: formatUnitSummary(attacker, attacker.hp),
              attackerDamageText: '-',
              defenderLabel: '-',
              defenderDamageText: '-',
            });
            return;
          }

          const target = defenderUnits[defenderIndex];
          const attackerHpBefore = attacker.hp;
          const attackerHpBeforeRaw = attacker.hp;
          const defenderHpBefore = target.hp;
          const defenderHpBeforeRaw = target.hpRaw;
          const result = combatEngine.calculateCombatExchange(attacker, target, attacker.splash);
          attacker.hp = result.attackerHp;
          target.hp = result.defenderHp;
          target.hpRaw = result.defenderHpRaw;
          rounds.push({
            index: attackerIndex + 1,
            attackerLabel: formatUnitSummary(attacker, attackerHpBefore),
            attackerDamageText: formatDamageFlow(
              attackerHpBefore,
              attackerHpBefore - result.attackerHp,
              attackerHpBeforeRaw - result.attackerHpRaw,
              result.attackerHp,
            ),
            defenderLabel: formatUnitSummary(target, defenderHpBefore),
            defenderDamageText: formatDamageFlow(
              defenderHpBefore,
              defenderHpBefore - result.defenderHp,
              defenderHpBeforeRaw - result.defenderHpRaw,
              result.defenderHp,
            ),
          });
        });

        return rounds;
      }

      function formatUnitSummary(unit, hp) {
        return `${unit.name} (HP${hp}/${unit.maxHp},A${unit.attack},D${unit.defense})`;
      }

      function formatDamageFlow(hpBefore, damageRounded, damageRaw, hpAfter) {
        return `${hpBefore} - ${damageRounded} (${damageRaw.toFixed(2)}) => ${hpAfter}`;
      }

      function renderResult() {
        resultBody.innerHTML = '';
        const rounds = computeQueueResult();

        rounds.forEach((round) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${round.index}</td>
            <td>${round.attackerLabel}</td>
            <td>${round.attackerDamageText}</td>
            <td>${round.defenderLabel}</td>
            <td>${round.defenderDamageText}</td>
          `;
          resultBody.appendChild(tr);
        });

        if (rounds.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="5">No attackers selected</td>';
          resultBody.appendChild(tr);
        }
      }

      function renderAll() {
        renderGroup(attackerList, state.attackers, 'attackers');
        renderGroup(defenderList, state.defenders, 'defenders');
        renderResult();
        syncUrl();
      }

      function appendUnit(side, selectedName) {
        const snapshot = makeUnitSnapshot(selectedName);
        if (!snapshot) return;

        if (side === 'attackers') {
          state.attackers.push({ name: snapshot.name, hp: snapshot.maxHp, splash: false, vet: false, hp10: false });
        } else {
          state.defenders.push({ name: snapshot.name, hp: snapshot.maxHp, defenseMode: DEFENSE_MODES.na, pois: false, vet: false, hp10: false });
        }

        renderAll();
      }

      function hydrateFromUrlAgainstUnits() {
        state.attackers = state.attackers
          .map((u) => {
            const base = makeUnitSnapshot(u.name, u);
            if (!base) return null;
            return {
              name: u.name,
              hp: Number.isNaN(u.hp) ? base.maxHp : clampHp(Math.round(u.hp), base.maxHp),
              splash: Boolean(u.splash && canSplash(u.name)),
              vet: Boolean(u.vet && canVet(u.name)),
              hp10: Boolean(u.hp10 && canHp10(u.name)),
            };
          })
          .filter(Boolean);

        state.defenders = state.defenders
          .map((u) => {
            const base = makeUnitSnapshot(u.name, u);
            if (!base) return null;
            return {
              name: u.name,
              hp: Number.isNaN(u.hp) ? base.maxHp : clampHp(Math.round(u.hp), base.maxHp),
              defenseMode: normalizeDefenseModeForUnit(u.name, u.defenseMode || DEFENSE_MODES.na),
              pois: Boolean(u.pois),
              vet: Boolean(u.vet && canVet(u.name)),
              hp10: Boolean(u.hp10 && canHp10(u.name)),
            };
          })
          .filter(Boolean);
      }

      function populateSelectors() {
        for (const select of [attackerSelect, defenderSelect]) {
          select.innerHTML = '';
          const placeholder = document.createElement('option');
          placeholder.value = '';
          placeholder.textContent = 'Select a unit';
          placeholder.selected = true;
          select.appendChild(placeholder);

          units.forEach((unit) => {
            const option = document.createElement('option');
            option.value = unit.name;
            const hpText = Number.isFinite(unit.health) ? unit.health : '15/10';
            option.textContent = `${unit.name} (HP ${hpText}, ATK ${unit.attack}, DEF ${unit.defence})`;
            select.appendChild(option);
          });
        }
      }

      function loadDataFromScript() {
        if (!window.POLYTOPIA_UNITS_DATA || !Array.isArray(window.POLYTOPIA_UNITS_DATA.units)) {
          throw new Error('units.json script data is missing.');
        }

        units = window.POLYTOPIA_UNITS_DATA.units;
        unitMap = new Map(units.map((u) => [u.name, u]));
      }

      attackerSelect.addEventListener('change', () => {
        if (!attackerSelect.value) return;
        appendUnit('attackers', attackerSelect.value);
        attackerSelect.value = '';
      });

      defenderSelect.addEventListener('change', () => {
        if (!defenderSelect.value) return;
        appendUnit('defenders', defenderSelect.value);
        defenderSelect.value = '';
      });

      (() => {
        parseStateFromUrl();
        try {
          loadDataFromScript();
          populateSelectors();
          hydrateFromUrlAgainstUnits();
          renderAll();
        } catch (error) {
          loadError.hidden = false;
          loadError.textContent = String(error.message || error);
        }
      })();
    </script>
  </body>
</html>
